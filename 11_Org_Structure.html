<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMOS team structure</title>
  <link rel="stylesheet" href="assets/doc.css">
</head>
<body data-doc="orgchart">
  <div class="toolbar noprint">
    <a href="00_Dashboard.html">Dashboard</a>
    <a href="11_Org_Structure.html" aria-current="page">Team structure</a>
    <a href="10_HR_Supervision.html">HR supervision</a>
    <button type="button" onclick="window.print()">Print</button>
  </div>

  <article class="page org-page">
    <header class="letterhead">
      <img alt="Company logo" src="assets/company-logo.jpg">
      <div class="who">
        <div class="company">AMOS</div>
        <div class="tag">Organisation &amp; project ownership</div>
      </div>
    </header>

    <section class="section">
      <h2>Working team structure</h2>
      <img class="org-chart-img" src="assets/team-org-chart.png" alt="AMOS org chart: CEO, CTO, HR and Operation, Production, R&amp;D-UAV, Design, R&amp;D-IOT">
    </section>

    <section class="section">
      <h2>Roles &amp; access (summary)</h2>
      <table class="dash-table">
        <thead>
          <tr><th>Role</th><th>Responsibility</th><th>System access</th></tr>
        </thead>
        <tbody id="roleBody"></tbody>
      </table>
    </section>

    <section class="section">
      <h2>People on file (from cloud Users)</h2>
      <table class="dash-table">
        <thead>
          <tr><th>Name</th><th>Role</th><th>Department</th><th>Reports to</th><th>Level</th></tr>
        </thead>
        <tbody id="peopleBody"></tbody>
      </table>
    </section>
  </article>

  <script src="assets/cloud-config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/org.js"></script>
</body>
</html>
