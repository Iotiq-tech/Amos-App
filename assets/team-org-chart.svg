<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="AMOS team structure">
  <defs>
    <style>
      .box{fill:#fff;stroke:#0b1f33;stroke-width:2;rx:8}
      .exec{fill:#0b1f33;stroke:#f0b429;stroke-width:2}
      .exec text{fill:#fff}
      .hr{fill:#4a1d6a;stroke:#c9a0dc;stroke-width:2}
      .hr text{fill:#fff}
      .mgr{fill:#e8f1fa;stroke:#1f5a8c;stroke-width:1.5}
      .line{stroke:#8fa3b8;stroke-width:2;fill:none}
      text{font-family:Segoe UI,Arial,sans-serif;font-size:13px;fill:#0b1f33;font-weight:600}
      .sub{font-size:11px;font-weight:400;fill:#5c6b7a}
    </style>
  </defs>
  <rect width="920" height="520" fill="#f7fafc"/>
  <text x="24" y="32" font-size="18" font-weight="700">AMOS  working team structure</text>
  <text x="24" y="52" class="sub">CEO &amp; CTO: full dashboard · HR: assignments + weekly completion · Dept managers assign team work · Cross-dept requests via owning manager</text>

  <g transform="translate(380,70)">
    <rect class="exec box" width="160" height="56" x="0" y="0"/>
    <text x="80" y="26" text-anchor="middle">CEO</text>
    <text x="80" y="44" text-anchor="middle" class="sub">Company oversight</text>
  </g>
  <path class="line" d="M460 126 L460 150"/>
  <g transform="translate(380,150)">
    <rect class="exec box" width="160" height="56"/>
    <text x="80" y="26" text-anchor="middle">CTO</text>
    <text x="80" y="44" text-anchor="middle" class="sub">Assigns projects &amp; owners</text>
  </g>

  <path class="line" d="M460 206 L460 230"/>
  <g transform="translate(720,230)">
    <rect class="hr box" width="160" height="56"/>
    <text x="80" y="26" text-anchor="middle">HR</text>
    <text x="80" y="44" text-anchor="middle" class="sub">Supervise all assignments</text>
  </g>
  <path class="line" d="M540 178 L720 250"/>

  <path class="line" d="M460 230 L460 250 L120 250 L120 280"/>
  <path class="line" d="M460 250 L300 250 L300 280"/>
  <path class="line" d="M460 250 L460 280"/>
  <path class="line" d="M460 250 L620 250 L620 280"/>
  <path class="line" d="M460 250 L780 250 L780 280"/>

  <g transform="translate(40,280)">
    <rect class="mgr box" width="160" height="70"/>
    <text x="80" y="28" text-anchor="middle">Projects</text>
    <text x="80" y="46" text-anchor="middle" class="sub">Manager + team</text>
    <text x="80" y="62" text-anchor="middle" class="sub">Enquiry · coordination</text>
  </g>
  <g transform="translate(220,280)">
    <rect class="mgr box" width="160" height="70"/>
    <text x="80" y="28" text-anchor="middle">Electronics</text>
    <text x="80" y="46" text-anchor="middle" class="sub">Manager + engineers</text>
    <text x="80" y="62" text-anchor="middle" class="sub">Design · 3D · PO</text>
  </g>
  <g transform="translate(400,280)">
    <rect class="mgr box" width="160" height="70"/>
    <text x="80" y="28" text-anchor="middle">Store</text>
    <text x="80" y="46" text-anchor="middle" class="sub">Manager + keepers</text>
    <text x="80" y="62" text-anchor="middle" class="sub">Stock · requisition</text>
  </g>
  <g transform="translate(580,280)">
    <rect class="mgr box" width="160" height="70"/>
    <text x="80" y="28" text-anchor="middle">Flight test</text>
    <text x="80" y="46" text-anchor="middle" class="sub">Manager + pilots</text>
    <text x="80" y="62" text-anchor="middle" class="sub">Outside test pass</text>
  </g>

  <g transform="translate(40,400)">
    <text x="0" y="0" font-size="12" font-weight="700">Ownership flow</text>
    <text x="0" y="22" class="sub">1. CTO assigns project ’ departments take ownership (ProjectTeams sheet)</text>
    <text x="0" y="40" class="sub">2. Dept manager assigns tasks to members · project pack updates each completion</text>
    <text x="0" y="58" class="sub">3. Cross-department request ’ receiving dept manager reviews &amp; assigns</text>
    <text x="0" y="76" class="sub">4. HR sees every assignment + weekly people completion report (read-only supervise)</text>
  </g>
</svg>